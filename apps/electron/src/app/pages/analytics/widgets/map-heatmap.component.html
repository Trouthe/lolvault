<div class="heatmap">
  @if (!hasTimeline()) {
    <app-empty-state
      inline
      icon="map"
      title="No position data for this match"
      hint="The map is built from the match timeline. Riot does not provide timelines for every game, and very old matches fall outside the Match API window."
    />
  } @else {
    <header class="heatmap-head">
      <app-segmented-toggle
        [options]="scopeOptions"
        [value]="scope()"
        label="Heatmap scope"
        compact
        (valueChange)="scope.set($event)"
      />
      <button
        type="button"
        class="marker-toggle"
        [class.on]="showMarkers()"
        [attr.aria-pressed]="showMarkers()"
        (click)="toggleMarkers()"
      >
        {{ showMarkers() ? 'Hide events' : 'Show events' }}
      </button>
    </header>

    <!-- Map -->
    <div class="map-stack">
      <canvas #baseLayer class="layer" aria-hidden="true"></canvas>
      <canvas #heatLayer class="layer" aria-hidden="true"></canvas>

      <div
        class="markers"
        role="img"
        [attr.aria-label]="'Match events between minute ' + startMinute() + ' and ' + endMinute()"
      >
        <!-- Kills and deaths wear a chip: the bare glyphs are small, flat and
             sit on top of a full-spectrum density field, where they disappear.
             The chip gives them a constant dark ground and a coloured ring. -->
        @for (marker of placedMarkers(); track $index) {
          <span
            class="marker"
            [class.kill]="marker.kind === 'kill'"
            [class.death]="marker.kind === 'death'"
            [class.objective]="marker.kind !== 'kill' && marker.kind !== 'death'"
            [style.left.%]="marker.left"
            [style.top.%]="marker.top"
            [title]="marker.tooltip"
          >
            <img class="marker-art" [src]="marker.icon" [alt]="marker.tooltip" />
          </span>
        }
      </div>
    </div>

    <!-- Controls sit under the map -->
    <div class="controls">
      <!-- A short game has no phases worth shortcutting to; the sliders below
           still cover any window the user wants. -->
      @if (presetOptions().length > 1) {
        <app-segmented-toggle
          [options]="presetOptions()"
          [value]="activePreset()"
          label="Time window"
          compact
          (valueChange)="applyPreset($event)"
        />
      }

      <div class="range">
        <div class="range-row">
          <label class="range-label" for="heat-start">From</label>
          <input
            id="heat-start"
            class="range-input"
            type="range"
            min="0"
            [max]="maxMinute()"
            [value]="startMinute()"
            (input)="onStartInput($event)"
          />
          <span class="range-value">{{ startMinute() }}m</span>
        </div>

        <div class="range-row">
          <label class="range-label" for="heat-end">To</label>
          <input
            id="heat-end"
            class="range-input"
            type="range"
            min="0"
            [max]="maxMinute()"
            [value]="endMinute()"
            (input)="onEndInput($event)"
          />
          <span class="range-value">{{ endMinute() }}m</span>
        </div>
      </div>

      <div class="summary-row">
        <dl class="legend">
          <div class="legend-item">
            <span class="legend-swatch cold" aria-hidden="true"></span>
            <dt>Passing through</dt>
          </div>
          <div class="legend-item">
            <span class="legend-swatch hot" aria-hidden="true"></span>
            <dt>Time spent</dt>
          </div>
          <div class="legend-item">
            <dt>Kills</dt>
            <dd>{{ markerCounts().kill }}</dd>
          </div>
          <div class="legend-item">
            <dt>Deaths</dt>
            <dd>{{ markerCounts().death }}</dd>
          </div>
          <div class="legend-item">
            <dt>Objectives</dt>
            <dd>{{ markerCounts().objective }}</dd>
          </div>
        </dl>
      </div>
    </div>
  }
</div>
